<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf6" />
    <meta name="description" content="Build future-ready technology and business skills with calm, expert-led learning designed to fit real life." />
    <!-- Icons: an SVG favicon (crisp at any size, ~0.5 KB) plus a raster
         apple-touch-icon for iOS home-screen bookmarks, which ignores SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Open Graph / Twitter. These static values describe the site as a whole;
         the router rewrites og:url and og:title per route at runtime, which is
         the honest limit for a client-rendered SPA (crawlers that don't execute
         JS see the site-level card, not a per-route one). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="E-Learning Hub" />
    <meta property="og:title" content="E-Learning Hub — Make room for your next skill" />
    <meta property="og:description" content="Build future-ready technology and business skills with calm, expert-led learning designed to fit real life." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="E-Learning Hub — Make room for your next skill" />
    <meta name="twitter:description" content="Build future-ready technology and business skills with calm, expert-led learning designed to fit real life." />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Fonts are self-hosted. The @font-face rules sit inline so the browser
         discovers them while parsing <head>, instead of first waiting on a
         render-blocking stylesheet from fonts.googleapis.com. Plus Jakarta Sans
         is a variable font, so a single file per subset covers weights 400-700. -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
    <title>E-Learning Hub — Make room for your next skill</title>
  </head>
  <body>
    <!-- Pre-paint landmark. The SPA needs a moment to mount <v-main>, which is what
         normally renders the page's <main>. Anything scanning that window (screen
         readers, audit tools) would find no main landmark at all. main.js replaces
         this synchronously on mount, so no frame ever has zero or two <main>s. -->
    <div id="app"><main id="main-content" tabindex="-1"></main></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
